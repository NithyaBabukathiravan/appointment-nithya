<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Appointment</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="navbar">
    <h1>Appointment Record System</h1>
    <a href="list.html">View Appointment List</a>
  </div>

  <div class="container">
    <div class="card">
      <h2>Add Appointment</h2>
      <div id="alertBox" class="alert"></div>

      <form id="appointmentForm" novalidate>
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Customer/patient name" />
          <div class="error-text" id="nameError">Name is required.</div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" />
          <div class="error-text" id="emailError">Enter a valid email address.</div>
        </div>

        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="number" id="phone" name="phone" placeholder="Contact number" />
          <div class="error-text" id="phoneError">Phone is required.</div>
        </div>

        <div class="form-group">
          <label for="appointmentDate">Appointment Date</label>
          <input type="date" id="appointmentDate" name="appointmentDate" />
          <div class="error-text" id="appointmentDateError">Appointment date is required.</div>
        </div>

        <div class="form-group">
          <label for="reason">Reason</label>
          <input type="text" id="reason" name="reason" placeholder="Reason for the appointment" />
          <div class="error-text" id="reasonError">Reason is required.</div>
        </div>

        <button type="submit" class="btn-primary">Save Appointment</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/add.js"></script>
</body>
</html>
