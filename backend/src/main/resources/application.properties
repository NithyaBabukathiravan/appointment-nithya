# Server
server.port=8080

# MySQL connection - update username/password/host to match your environment
spring.datasource.url=jdbc:mysql://localhost:3306/appointment_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# 'update' auto-creates/updates the appointments table from the Appointment entity on startup.
# Use the schema.sql in /database if you prefer to create the table manually instead,
# in which case switch this to 'validate' or 'none'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
